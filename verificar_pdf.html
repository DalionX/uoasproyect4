<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Verificar PDF</title></head>
<body>
<input id="archivo" type="file" accept="application/pdf">
<pre id="resultado">Esperando archivo...</pre>
<script>
/* Comprueba los PDF generados en este proyecto sin depender de Python. */
document.getElementById('archivo').addEventListener('change', async function () {
  const f = this.files[0];
  if (!f) return;
  const bytes = new Uint8Array(await f.arrayBuffer());
  const texto = new TextDecoder('latin1').decode(bytes);
  const inicioXref = texto.match(/startxref\n(\d+)\n%%EOF/);
  const posicion = inicioXref ? Number(inicioXref[1]) : -1;
  const fuentes = ['Helvetica', 'Helvetica-Bold', 'Courier'].filter(function (nombre) {
    return texto.indexOf('/BaseFont /' + nombre) !== -1;
  });
  document.getElementById('resultado').textContent = JSON.stringify({
    nombre: f.name,
    tamano: f.size,
    cabecera: texto.slice(0, 8),
    paginas: (texto.match(/\/Type \/Page\b/g) || []).length,
    mediaBoxA4: texto.indexOf('/MediaBox [0 0 595.2756 841.8898]') !== -1,
    fuentes: fuentes,
    xrefValido: posicion >= 0 && texto.slice(posicion, posicion + 4) === 'xref',
    terminaCorrectamente: texto.trimEnd().slice(-5) === '%%EOF'
  }, null, 2);
});
</script>
</body>
</html>
