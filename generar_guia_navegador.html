<p>Generador alternativo de GUIA_PRINCIPIANTES.pdf con el modelo visual del PDF de referencia.</p>

<script>
/* Puerto a JavaScript de generar_guia_principiantes.py; conserva paleta, fuentes, margenes y tablas. */
const NL = "\n";
const BS = "\\";
const C = {
  navy: ".070588 .192157 .352941",
  blue: ".113725 .305882 .537255",
  black: "0 0 0",
  violet: ".541176 .168627 .886275",
  white: "1 1 1",
  zebra: ".956863 .968627 .984314",
  border: ".721569 .768627 .839216"
};
const F = { cuerpo: "/F1", titulo: "/F2", codigo: "/F3" };
const X = 56.69291;
const ANCHO = 481.8898;
const ALTO = 790;

function esc(s) {
  return s.split("\\").join("\\\\").split("(").join("\\(").split(")").join("\\)");
}

function wrap(s, n) {
  const salida = [];
  let actual = "";
  for (const palabra of s.split(" ")) {
    const candidata = (actual + " " + palabra).trim();
    if (candidata.length > n && actual) {
      salida.push(actual);
      actual = palabra;
    } else {
      actual = candidata;
    }
  }
  if (actual) salida.push(actual);
  return salida;
}

class Pagina {
  constructor() { this.comandos = []; this.y = ALTO; }
  texto(color, fuente, size, x, y, s) {
    this.comandos.push(color + " rg " + fuente + " " + size + " Tf 1 0 0 1 " + x + " " + y + " Tm (" + esc(s) + ") Tj");
  }
  titulo(s) { this.texto(C.navy, F.titulo, 20, X, this.y, s); this.y -= 30; }
  seccion(s) { this.y -= 12; this.texto(C.blue, F.titulo, 14, X, this.y, s); this.y -= 24; }
  cuerpo(s) {
    for (const linea of wrap(s, 95)) { this.texto(C.black, F.cuerpo, 9.5, X + 13, this.y, linea); this.y -= 13; }
    this.y -= 4;
  }
  lista(s, numero) {
    const marca = numero ? numero + "." : BS + "225";
    this.texto(C.black, F.cuerpo, 9.5, X, this.y, marca);
    const lineas = wrap(s, 88);
    lineas.forEach((linea, i) => this.texto(C.black, F.cuerpo, 9.5, X + 13, this.y - i * 13, linea));
    this.y -= 13 * lineas.length + 3;
  }
  tabla(cabeceras, filas, anchos, columnasCodigo) {
    const codigo = columnasCodigo || [];
    const x = X, altoCabecera = 16, total = ANCHO, top = this.y;
    this.comandos.push(C.blue + " rg " + x + " " + this.y + " " + total + " " + altoCabecera + " re f");
    let cx = x + 6;
    cabeceras.forEach((cabecera, i) => {
      this.texto(C.white, F.titulo, 8, cx, this.y + 5, cabecera);
      cx += anchos[i];
    });
    this.y -= altoCabecera;
    const separadores = [this.y];
    filas.forEach((fila, r) => {
      const celdas = fila.map((valor, i) => wrap(String(valor), Math.max(1, Math.floor(anchos[i] / 4.3))));
      const nlineas = Math.max.apply(null, celdas.map(c => c.length));
      const alto = Math.max(16, 8 + nlineas * 10);
      const fondo = r % 2 ? C.zebra : C.white;
      this.comandos.push(fondo + " rg " + x + " " + (this.y - alto) + " " + total + " " + alto + " re f");
      let cc = x + 6;
      celdas.forEach((celda, i) => {
        const color = codigo.indexOf(i) >= 0 ? C.violet : C.black;
        const fuente = codigo.indexOf(i) >= 0 ? F.codigo : F.cuerpo;
        celda.forEach((linea, k) => this.texto(color, fuente, 8, cc, this.y - 9 - k * 10, linea));
        cc += anchos[i];
      });
      this.y -= alto;
      separadores.push(this.y);
    });
    this.comandos.push(C.border + " RG .4 w " + x + " " + this.y + " " + total + " " + (top - this.y) + " re S");
    separadores.slice(1, -1).forEach(sy => this.comandos.push(C.border + " RG .4 w " + x + " " + sy + " m " + (x + total) + " " + sy + " l S"));
    let cx2 = x;
    anchos.slice(0, -1).forEach(ancho => {
      cx2 += ancho;
      this.comandos.push(C.border + " RG .4 w " + cx2 + " " + this.y + " m " + cx2 + " " + top + " l S");
    });
    this.y -= 14;
  }
}

function construirPdf(paginas) {
  const objetos = [];
  function add(s) { objetos.push(s); return objetos.length; }
  add("<< /Type /Catalog /Pages 2 0 R >>");
  add("<< /Type /Pages /Kids [] /Count 0 >>");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>");
  const numeros = [];
  for (const pagina of paginas) {
    const contenido = pagina.comandos.join(NL) + NL;
    const nc = add("<< /Length " + contenido.length + " >>" + NL + "stream" + NL + contenido + "endstream");
    const np = add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.2756 841.8898] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents " + nc + " 0 R >>");
    numeros.push(np);
  }
  objetos[1] = "<< /Type /Pages /Kids [" + numeros.map(n => n + " 0 R").join(" ") + "] /Count " + numeros.length + " >>";
  let pdf = "%PDF-1.4" + NL;
  const off = [0];
  objetos.forEach((obj, i) => {
    off.push(pdf.length);
    pdf += (i + 1) + " 0 obj" + NL + obj + NL + "endobj" + NL;
  });
  const xref = pdf.length;
  pdf += "xref" + NL + "0 " + (objetos.length + 1) + NL + "0000000000 65535 f " + NL;
  off.slice(1).forEach(o => { pdf += String(o).padStart(10, "0") + " 00000 n " + NL; });
  pdf += "trailer" + NL + "<< /Size " + (objetos.length + 1) + " /Root 1 0 R >>" + NL + "startxref" + NL + xref + NL + "%%EOF";
  return pdf;
}

window.generarGuiaPDF = function () { return construirPdf(construirPaginas()); };
document.getElementById("descargar").addEventListener("click", function () {
  const blob = new Blob([window.generarGuiaPDF()], { type: "application/pdf" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "GUIA_PRINCIPIANTES.pdf";
  a.click();
  URL.revokeObjectURL(a.href);
});
